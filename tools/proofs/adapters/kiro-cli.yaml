tool: kiro-cli
version_command: "kiro-cli --version"

invoke:
  command: 'kiro-cli chat --no-interactive -a --wrap never --agent {agent} "{query}"'
  command_no_agent: 'kiro-cli chat --no-interactive -a --wrap never "{query}"'
  timeout: 90
  # engine: optional agent-engine selector (v2 | v3). Omit for the binary default
  # (v2 on kiro-cli 2.27.0 headless). Override per-run with PROOF_ENGINE=v3.
  # Spike 168 (tools/proofs/docs/v3-engine-notes.md): v3 runs headless with -a;
  # stream-json is ACP v1 + extra info subtypes; tool name is kind/title (not _meta.kiro.toolName).
  # engine: v2
  # output_format: when set to stream-json (kiro-cli >= 2.19.2), the harness captures the
  # ACP event stream and grades log_checks/events from it instead of inspect-session.sh
  # (no session-log race; works on v3). Opt-in; default = legacy text path.
  # Override per-run with PROOF_OUTPUT_FORMAT=stream-json. Schema: tools/proofs/docs/stream-json-schema.md.
  # output_format: stream-json

agent:
  format: json
  location: ".kiro/agents/{name}.json"
  template: |
    {
      "name": "{name}",
      "description": "{description}",
      "tools": {tools},
      "allowedTools": {allowed_tools},
      "resources": {resources},
      "prompt": "{prompt}",
      "permissions": { "rules": [] }
    }

skill:
  location: ".kiro/skills/{name}/SKILL.md"
  format: markdown-frontmatter
  glob_resource: "skill://.kiro/skills/**/SKILL.md"

eager_context:
  location: ".kiro/steering/{scope}/{name}.md"
  format: markdown-frontmatter
  extra_frontmatter:
    inclusion: always

prompt:
  location: ".kiro/prompts/{name}.md"
  format: markdown-frontmatter
  invocation_prefix: "@"

output:
  strip_ansi: true
  encoding: utf-8
