tool: agy
version_command: "agy --version"

invoke:
  # NOTE: --print is a GREEDY value flag — attach the prompt as --print="..." and
  # keep --dangerously-skip-permissions elsewhere on the line, or agy swallows the
  # flag as the prompt (agy prints an explicit error telling you to do this).
  command: 'agy --dangerously-skip-permissions --output-format stream-json --print="{query}"'
  timeout: 120
  eval_harness_status: supported
  notes: |
    --print="..." runs non-interactively; --output-format stream-json emits NDJSON on
    STDOUT (init → step_update* → result). --dangerously-skip-permissions =
    permission_mode:"always-proceed" (auto-approves tool calls; the codex
    --dangerously-bypass-approvals-and-sandbox / opencode --auto equivalent).
    Auth required: run `agy` interactively first to complete Google Sign-In.
    Validate by OUTPUT content (terminal result.status=="SUCCESS" + non-empty
    result.response), NOT exit code. Bound with --print-timeout (default 5m).
    Issue #76 (--print drops stdout in non-TTY) is FIXED as of agy 1.1.22 — verified
    2026-08-30: piped, stdin </dev/null, stdout→file yields 2030 bytes, exit 0, a
    terminal {"event":"result","result":{"status":"SUCCESS",...}}. For older builds
    the file-canary workaround (ask agent to write the answer to a file, read it) still
    applies.

# dispatch-review matrix leg (ticket 142). matrix.sh resolves a model to this tool
# and uses per-tool invoke/parse; it does NOT printf-expand `command` (that string
# documents the shape). Validation predicate is agy-specific: terminal event:"result"
# + result.status=="SUCCESS" + non-empty result.response (NOT opencode's step_finish).
dispatch_review:
  command: 'agy --dangerously-skip-permissions --model {model} --output-format stream-json --print-timeout {timeout}s --print="{query}"'
  timeout: 600
  # Gemini Pro is the review-grade tier (controlled review benchmarks test Pro, not
  # Flash). It is a high-SNR / high-precision, lower-recall DIVERSITY voice, not a
  # solo reviewer — which matches the matrix design.
  models:
    - gemini-3.1-pro-high
  result_validation: 'last event:"result" with .result.status=="SUCCESS" and non-empty .result.response'

skill:
  location: ".agents/skills/{name}/SKILL.md"
  format: markdown
  global_location: "~/.gemini/antigravity-cli/skills/"
  discovery: |
    Global: ~/.gemini/antigravity-cli/skills/
    Workspace: .agents/skills/
    Skills use /skills command in-session. No terminal-level management command yet.
    Install community skills: npx skills install <name>

agents_md:
  location: "AGENTS.md"
  format: markdown
  global_location: "~/.gemini/AGENTS.md"
  tool_specific: "GEMINI.md"
  tool_specific_global: "~/.gemini/GEMINI.md"
  discovery: |
    Precedence (highest to lowest):
    1. System rules (Google DeepMind, immutable)
    2. GEMINI.md (agy-specific overrides, wins over AGENTS.md)
    3. AGENTS.md (cross-tool foundation)
    4. .agent/rules/ (supplemental workspace rules)
    Scopes:
    - Global: ~/.gemini/AGENTS.md, ~/.gemini/GEMINI.md
    - Project: ./AGENTS.md, ./GEMINI.md
    - Nested: subdirectory AGENTS.md (opt-in via settings)

plugins:
  migrate_from: "agy plugin import gemini"
  location: "~/.gemini/antigravity-cli/plugins/"
  notes: "Replaces Gemini CLI 'extensions'. Commands become skills on import."

mcp:
  config_file: ".agents/mcp_config.json"
  global_config: "~/.gemini/antigravity-cli/mcp_config.json"
  notes: |
    Remote servers use 'serverUrl' field (not 'url' or 'httpUrl').
    Config is separate file, not inline in settings.json.

hooks:
  format: json
  notes: |
    JSON hooks intercept agent lifecycle: before tool call, after file edit, session start.
    Same format as Antigravity 2.0 hooks.

subagents:
  supported: true
  notes: |
    Main agent spawns focused subagents for parallel/background work.
    Async workflows: large refactors, multi-topic research run as subagents.

output:
  strip_ansi: true
  encoding: utf-8

install:
  macos_linux: "curl -fsSL https://antigravity.google/cli/install.sh | bash"
  windows_powershell: "irm https://antigravity.google/cli/install.ps1 | iex"
  windows_cmd: "curl -fsSL https://antigravity.google/cli/install.cmd -o install.cmd && install.cmd && del install.cmd"
  binary_name: "agy"

notes: |
  Antigravity CLI (agy) is Google's Go-based terminal agent, replacing Gemini CLI (May 2026).
  Same agent harness as Antigravity 2.0 desktop app.
  Settings and permissions sync bidirectionally with Antigravity 2.0.
  Conversations can be exported to 2.0 via @conversation dropdown.
  Auth: system keyring + Google Sign-In. SSH sessions get printed auth URL.
  Enterprise: connects via GCP project. Consumer: Google AI Pro/Ultra.

  RESOLVED / CORRECTED (2026-08-30, verified on agy 1.1.22):
  - Issue #76 (--print drops stdout in non-TTY: pipe, redirect, subprocess) is FIXED.
    Verified: piped + stdin </dev/null + stdout→file → 2030 bytes, exit 0, terminal
    result event. Eval-harness/dispatch-review integration is UNBLOCKED.
  - `--output-format {text,json,stream-json}` DOES exist; stream-json emits NDJSON on
    stdout. Earlier "no --json/--output flag" note was stale.
  - --print is a greedy value flag: attach the prompt as --print="..." (see invoke.notes).

  SESSION ANALYSIS:
  - --log-file captures tool calls and timing but NOT response text.
  - Conversation DB: ~/.gemini/antigravity-cli/conversations/{cascade_id}.db (SQLite, protobuf blobs)
  - Best path: antigravity-trajectory-extractor (live RPC to running language_server)
    Exports decoded steps + transcript as JSON/Markdown.
    Repo: github.com/jijiamoer/antigravity-trajectory-extractor
