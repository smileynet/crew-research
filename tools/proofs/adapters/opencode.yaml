tool: opencode
version_command: "opencode --version"

invoke:
  command: 'opencode run --auto "{query}"'
  timeout: 300
  # --auto = auto-approve permissions not explicitly denied (sandbox-bypass;
  #   required headless or permission prompts hang).

# dispatch-review matrix runner uses per-model invocation (NOT the proof harness,
# which doesn't substitute {model}). See skills/dispatch-review/references/model-matrix.md.
dispatch_review:
  command: 'opencode run --auto -m {model} --format json "{query}"'
  # {model} = provider/model id (e.g. kimi-for-coding/k3, alibaba-token-plan/qwen3.8-max,
  #   zai-coding-plan/glm-5.3). --format json → JSONL on stdout (see output.json).
  models:
    - kimi-for-coding/k3
    - alibaba-token-plan/qwen3.8-max
    - zai-coding-plan/glm-5.3

skill:
  global_location: "~/.config/opencode/skills/{name}/SKILL.md"
  project_location: ".opencode/skills/{name}/SKILL.md"
  format: markdown-frontmatter
  # Also auto-loads from ~/.agents/skills/ and ~/.claude/skills/

steering:
  location: "~/.config/opencode/AGENTS.md"
  wiring: 'opencode.json → "instructions" array (concat-dedup across layers)'

output:
  strip_ansi: true
  encoding: utf-8
  json:
    # `--format json` emits JSONL on stdout (verified opencode 1.18.21).
    # Envelope: {type, timestamp, sessionID, part{...}}. Event types:
    #   step_start | text (part.text = content) | step_finish (part.reason:"stop" = clean; part.tokens, part.cost)
    # Final text:  jq -rn '[inputs|select(.type=="text")|.part.text]|join("")'
    # Clean check: last step_finish .part.reason == "stop"
    # Capture stdout/stderr SEPARATELY (> events.jsonl 2> logs.txt), never 2>&1.
    exit_code: unreliable
    # opencode may exit 0 on failure, hang, or surface 429 silently in-stream.
    # Confirm success by step_finish reason:"stop" + non-empty final text, NOT exit code.
    # Wrap every invocation in a timeout (no built-in run timeout).
    # Provider/model errors surface as a type:"error" event in the JSONL on STDOUT
    #   (e.g. {"type":"error",...,"error":{"name":"UnknownError","data":{"message":...}}}),
    #   NOT on stderr — stderr is often empty on failure. To classify a failure,
    #   parse the error event: jq 'select(.type=="error") | .error.data.message // .error.name'.
    #   (Verified 2026-08-29 building matrix.sh --health: a stderr-only classifier missed it.)

notes: |
  OpenCode (anomalyco/opencode, TypeScript) — MIT-licensed AI coding agent.
  Skill format identical to crew-research (SKILL.md + YAML frontmatter: name, description).
  Auto-loads skills from 6 paths: .opencode/skills/, ~/.config/opencode/skills/,
  .claude/skills/, ~/.claude/skills/, .agents/skills/, ~/.agents/skills/.
  First-discovered wins on duplicate skill names (native path checked first).
  Config: ~/.config/opencode/opencode.json (or .jsonc — supports comments).
  Non-interactive mode: 'opencode run "prompt"' (exits after completion).
  Auth: 'opencode providers login' (interactive) or env vars (OPENROUTER_API_KEY, etc.).
  CloseCode (Amazon fork) shares the same adapter pattern but is Bedrock-only.

eval_harness_status: "supported (invoke.command provides non-interactive execution)"
