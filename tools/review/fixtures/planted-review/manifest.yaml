# Planted-bug manifest — ground truth for dispatch-review e2e (ticket 130).
# Scoring (Phase 6): agents grade via a JUDGE PANEL (multi-judge consensus,
#   reusing the eval-harness pattern) — NOT a deterministic matcher. For each
#   reviewer finding the panel labels CONFIRMED / PLAUSIBLE / FABRICATED against
#   this manifest as the answer key. same_file ∧ line±5 is a coarse locator/
#   pre-filter only; the grade is the judges' semantic verdict (same defect +
#   right reason). Category is ADVISORY (Phase 2: model taxonomies differ, e.g.
#   Kimi "correctness" vs manifest "security" with exact location).
# Report per-reviewer recall + precision + hallucination-rate (FDR); score each
# consensus tier (union≥1 / majority / unanimous) as a virtual reviewer.
# PLAUSIBLE (real but unplanted) is excluded from FP; FABRICATED = hallucination.

fixture: planted-review
description: >
  Small TypeScript user-directory service with 10 deliberately planted defects
  across a Type1/Type2/Type3 difficulty spread. Reviewed WHOLESALE at the tip
  commit (matrix.sh checks out a detached worktree and reads the tree; there is
  no diff). Type3 bugs span files and require reasoning, not pattern-matching —
  they are the discriminators between reviewers that leave the diff and those
  that don't.

expected_findings:
