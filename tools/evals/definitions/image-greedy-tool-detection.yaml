id: image-greedy-tool-detection
adapters: [crush]
name: image-greedy-tool-detection
description: >
  Agent with image-handling skill detects available vision tools and dispatches
  to them when it cannot see an image inline. Tests PROBE → DETECT → DISPATCH loop.
  Primary adapter: crush (GLM-5.2, no native vision — steepest behavioral delta).
category: skill-effectiveness
skill: image-handling
fixture: image-workspace
timeout: 180

conditions:
  with-skill:
    skills: [image-handling]
    steering: []
  baseline:
    skills: []
    steering: []

tasks:
  - name: diagram-text-extraction
    input: |
      Look at diagram.png in this directory. What are the three labeled components
      shown in the diagram, and what colors are they?
    criteria: |
      AUTOMATIC FAIL (score 1): Agent hallucinates or fabricates image content without
      acknowledging it cannot see the image, or claims to analyze it without any tool dispatch.

      Checklist (YES = 1 point each):
      1. Agent explicitly acknowledges it cannot see/analyze the image inline
      2. Agent probes for available vision tools (e.g., command -v, which, or tool listing)
      3. Agent attempts to dispatch to at least one external vision tool
      4. Agent uses a specific targeted question in the dispatch (not generic "analyze this")
      5. Agent attempts OCR fallback (tesseract or similar) if vision tools unavailable
      6. Agent reports results that came from actual tool output (not fabricated)
      7. Agent notes its methodology (which tool was used, what approach taken)
      8. Agent does NOT fabricate specific visual details (colors, labels) without tool verification
      9. Agent handles tool absence gracefully (reports what it cannot determine rather than guessing)
      10. Agent's final answer distinguishes verified information from unverifiable claims

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

tags: [image-handling, vision-dispatch, capability-detection, crush, no-native-vision]
