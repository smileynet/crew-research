id: spec-self-gating-effectiveness  # immutable — survives renames; never change once results reference it
name: spec-self-gating-effectiveness
description: "Does the spec-driven-development skill cause the agent to self-gate (refuse vague input, self-review before presenting) when NOT explicitly asked to review?"
skill: spec-driven-development
fixture: defu

conditions:
  with-skill:
    skills: [spec-driven-development]
  baseline:
    skills: []

tasks:
  - name: write-spec-from-vague-input
    input: "Write a spec for a caching layer. It should be fast and handle various edge cases appropriately."
    criteria: |
      AUTOMATIC FAIL (score 1): Produces a complete spec document filling in its own assumptions for what "fast" and "various edge cases" mean.

      Binary checklist — award one point per YES:
      1. Agent identifies "fast" as vague/unspecified (needs a concrete metric)
      2. Agent identifies "various edge cases" as vague/unspecified
      3. Agent identifies "appropriately" as subjective and needing definition
      4. Agent asks about cache eviction policy (LRU, TTL, LFU, etc.)
      5. Agent asks about performance targets (e.g., p99 latency, throughput)
      6. Agent asks about cache size limits or memory constraints
      7. Agent asks about consistency model or invalidation strategy
      8. Agent asks about what data is being cached
      9. Agent does NOT produce a complete spec document
      10. Agent explicitly names the clarification gate or states it cannot proceed without answers
      11. Agent proposes concrete options for at least one vague term (e.g., "fast: <10ms p99 or <100ms p99?")

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-11=5

  - name: write-spec-bloated-request
    input: "Write a spec for user management. It needs signup, login, SSO, roles, permissions, teams, invitations, audit trail, and account deletion with data export."
    criteria: |
      AUTOMATIC FAIL (score 1): Writes one large spec containing all 9 capabilities.

      Binary checklist — award one point per YES:
      1. Agent identifies this as multiple features (not a single spec)
      2. Agent proposes decomposition into separate specs/features
      3. Decomposition groups related capabilities logically (e.g., auth, authorization, team-management, audit)
      4. Agent identifies dependency ordering between specs (e.g., roles before permissions before teams)
      5. Agent asks which spec to write first (or recommends a starting point)
      6. Agent does NOT write a single monolithic spec covering all 9 items
      7. Agent assesses complexity (explicitly or implicitly by noting scope)
      8. Agent proposes a PLAN.md or phased approach
      9. Agent identifies at least 3 distinct feature boundaries in the list
      10. Agent offers to write the first focused spec once decomposition is agreed

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - name: produce-spec-with-testable-validation
    input: "Write a spec for a rate limiter. 100 requests per minute per API key, sliding window, returns 429 when exceeded."
    criteria: |
      AUTOMATIC FAIL (score 1): Validation section says "rate limiting works correctly" or "requests are limited."

      Binary checklist — award one point per YES:
      1. Spec has a Validation section with specific test scenarios
      2. At least one test specifies exact input→output (e.g., "101st request in 60s → HTTP 429")
      3. A test covers the window sliding behavior (request after window passes → HTTP 200)
      4. A test covers independent counters per API key
      5. Non-Goals section exists identifying what is NOT rate-limited
      6. Validation distinguishes test types (blackbox/curl, automated/script, edge cases)
      7. Edge cases are identified (clock skew, distributed counters, burst behavior)
      8. Requirements reference all input constraints (100/min, per API key, sliding window, 429)
      9. Spec is structured with clear sections (What, Requirements, Validation at minimum)
      10. Validation tests are concrete enough to implement directly (not prose descriptions)

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - name: refuse-to-implement-without-spec
    input: "I need a webhook system. Just start building it — receivers register URLs, we POST events to them with retries."
    criteria: |
      AUTOMATIC FAIL (score 1): Starts writing implementation code immediately.

      Binary checklist — award one point per YES:
      1. Agent pushes back on "just start building" directive
      2. Agent proposes writing a spec (or at minimum clarification) before implementing
      3. Agent asks about retry policy (how many retries, backoff strategy)
      4. Agent asks about event format/payload structure
      5. Agent asks about authentication (HMAC signing, secret verification)
      6. Agent asks about failure handling (dead letter queue, alerting)
      7. Agent asks about delivery guarantees (at-least-once, exactly-once)
      8. Agent does NOT produce implementation code
      9. Agent assesses complexity of the request
      10. Agent identifies that the request has enough info for some requirements but missing validation criteria and non-goals

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

trials: 3
threshold: 3
delta_threshold: 1.0
timeout: 120
tags: [skill-effectiveness, spec-driven, self-gating, unprompted-behavior]
