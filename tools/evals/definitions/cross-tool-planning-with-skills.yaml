id: cross-tool-planning-with-skills  # immutable — survives renames; never change once results reference it
known_gap: "codex-family judging — fails on codex-family judges while kiro siblings pass; not a fresh regression (triage 2026-07-17)"
name: cross-tool-planning-with-skills
description: "Compare planning quality across tools WITH grill-with-docs and source-authority skills deployed."
skill: grill-with-docs
fixture: defu

conditions:
  with-skills:
    skills: [grill-with-docs, source-authority]
  baseline:
    skills: []

tasks:
  - input: "Read the source code in src/ and the test files. Then write a PLAN.md (under 20 lines) for adding a 'onConflict' callback option to defu that lets users handle merge conflicts for specific key paths. The plan should cover: what to change, what to test, and what risks exist."
    criteria: |
      AUTOMATIC FAIL (score 1): Generic plan that could apply to any project. No evidence of reading the source code. No file paths or function names referenced.

      Binary checklist — award one point per YES:
      1. References specific source files by path (e.g., src/defu.ts, src/types.ts)
      2. References specific functions by name (e.g., _defu, createDefu, or the merger pattern)
      3. Proposes a type-safe API design for onConflict consistent with existing patterns
      4. Identifies how existing merger/createDefu pattern relates to the proposed callback
      5. Lists specific test scenarios (not just "add tests")
      6. Identifies at least one real risk (breaking changes, performance, or type inference)
      7. References actual test file locations or existing test patterns
      8. Plan identifies edge cases from actual code (e.g., array handling, null handling)
      9. Plan is under 20 lines as requested
      10. Risk assessment references downstream consumers or type export concerns
      11. Plan demonstrates understanding of how the merge recursion works

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-11=5

  - input: "Read the project structure and tests. Write a CHANGELOG entry (in Keep a Changelog format) summarizing what changed in the most recent commits. Write it to CHANGELOG-DRAFT.md."
    criteria: |
      AUTOMATIC FAIL (score 1): Fabricates changes not in the repo, or produces generic template without reading git log. Doesn't write the file.

      Binary checklist — award one point per YES:
      1. Reads git log to identify recent commits
      2. Entries are based on actual commits (not fabricated)
      3. Uses correct Keep a Changelog format (## [version] - date, ### Category)
      4. Entries are grouped correctly under categories (Added/Changed/Fixed/Removed)
      5. Descriptions are user-facing (not raw commit messages)
      6. Entries are concise (one line per change)
      7. File is written to CHANGELOG-DRAFT.md
      8. File is well-formatted markdown
      9. Includes relevant version context or date
      10. Categories are correctly chosen (not everything under "Changed")

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - input: "There's a bug: when using defu with arrays, if a user passes `null` for an array field, defu treats it as an empty value and the default array wins. The expected behavior is that explicit null should override the default. Read the source and tests, identify where this happens, and write a fix. Write the fix directly to the source file."
    criteria: |
      AUTOMATIC FAIL (score 1): Doesn't read the source. Proposes changes to wrong files. Fix is syntactically invalid or conceptually wrong.

      Binary checklist — award one point per YES:
      1. Reads the source file(s) before proposing changes
      2. Identifies the correct location where null/undefined check happens in merge logic
      3. Correctly explains the current null handling behavior
      4. Fix distinguishes explicit null from undefined
      5. Fix preserves existing behavior for non-null cases (no regressions)
      6. Fix preserves existing behavior for undefined cases
      7. Fix is written directly to the source file as requested
      8. Fix is minimal and precise (doesn't rewrite unrelated logic)
      9. Fix considers backward compatibility implications
      10. Agent adds or suggests a test case for the new null-override behavior

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

trials: 2
threshold: 3
delta_threshold: 0.3
timeout: 300
tags: [cross-tool, planning, code-writing, prose, skills-impact]
