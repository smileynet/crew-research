id: spec-validator-agent-effectiveness  # immutable — survives renames; never change once results reference it
name: spec-validator-agent-effectiveness
description: "Does adding the code-review skill alongside spec-driven-development catch spec quality issues (vague validation, scope creep) that spec-driven-development alone misses?"
skill: spec-driven-development
fixture: defu

conditions:
  with-validator:
    skills: [spec-driven-development, code-review]
  baseline:
    skills: [spec-driven-development]

tasks:
  - name: catch-vague-validation
    input: |
      I wrote this spec. Review it for quality:

      # Feature: User Authentication
      ## Status: Accepted
      ## What
      Handle user login and registration.
      ## Who / Why
      All users need to authenticate.
      ## Non-Goals
      None.
      ## Requirements
      - Users can register
      - Users can log in
      - Authentication should be secure
      ## Validation
      - It works correctly
      - Users can log in and out
    criteria: |
      AUTOMATIC FAIL (score 1): Approves the spec or suggests only formatting changes.

      Binary checklist — award one point per YES:
      1. Identifies "it works correctly" as untestable validation
      2. Identifies "Users can log in and out" as too vague for validation
      3. Identifies "should be secure" as a vague requirement (needs specifics)
      4. Identifies "None" for Non-Goals as lazy/incomplete (auth always has boundaries)
      5. Notes that requirements lack acceptance criteria or concrete test cases
      6. Suggests rewriting validation as concrete tests (e.g., specific API calls with expected responses)
      7. Proposes specific Non-Goals (e.g., "no OAuth in v1", "no MFA in v1")
      8. Notes that "Who/Why" is too thin (just restates the obvious)
      9. Identifies that "What" section lacks detail on scope/approach
      10. Questions the empty or missing Unresolved Questions section

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - name: catch-scope-creep-in-spec
    input: |
      Review this spec — I keep adding things and I'm not sure where to stop:

      # Feature: Cartridge Format
      ## Status: Draft
      ## What
      Package games into distributable files. Also handle DRM, online leaderboards, achievement tracking, cloud saves, auto-updates, and a storefront API.
      ## Who / Why
      Game developers who want to distribute their games.
      ## Non-Goals
      - Won't handle marketing
      ## Requirements
      - Package Lua scripts, sprites, audio into single file
      - Sign cartridges cryptographically
      - Integrate with Steam, Epic, and GOG APIs
      - Track player achievements across devices
      - Support cloud save synchronization
      - Auto-update cartridges when new versions are available
      ## Validation
      - All features work end to end
    criteria: |
      AUTOMATIC FAIL (score 1): Accepts the spec as reasonable.

      Binary checklist — award one point per YES:
      1. Identifies massive scope creep (a packaging format has grown into an online platform)
      2. Explicitly names DRM as out of scope for a cartridge format spec
      3. Explicitly names online leaderboards as a separate feature/spec
      4. Explicitly names achievements as a separate feature/spec
      5. Explicitly names cloud saves as a separate feature/spec
      6. Explicitly names storefront API as a separate feature/spec
      7. Proposes splitting into multiple specs (at least 2 distinct specs suggested)
      8. Identifies that the core cartridge format = packaging only (Lua, sprites, audio into a file)
      9. Suggests moving non-core items to Non-Goals of the cartridge spec
      10. Identifies "all features work end to end" as untestable validation
      11. Rewrites or proposes rewriting requirements focused on the core packaging concern

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-11=5

trials: 3
threshold: 3.0
delta_threshold: 0
timeout: 150
tags: [skill-effectiveness, spec-validation]
