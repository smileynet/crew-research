id: steering-pointer-effectiveness  # immutable — survives renames; never change once results reference it
name: steering-pointer-effectiveness
description: "Does a steering pointer reliably cause the agent to read a manual-inclusion detail file and incorporate its content during skill execution?"
skill: grill-with-docs
fixture: defu

conditions:
  with-pointer:
    skills: [grill-with-docs]
    steering: [grill-pointer.md, grill-context.md]
  baseline:
    skills: [grill-with-docs]

tasks:
  - input: "Run a grill-with-docs session on this plan: 'Add multiplayer support to the game engine using WebSockets for real-time state synchronization between players.'"
    criteria: |
      AUTOMATIC FAIL (score 1): Agent runs grill-with-docs generically without reading or referencing any project-specific context file.

      Score each YES/NO independently:
      1. Agent reads the detail file (grill-context.md) via the pointer instruction.
      2. Uses domain-specific terminology from the file (tick rate, delta compression, ECS, client-side prediction).
      3. Asks questions about bandwidth budgets or network constraints from the detail file.
      4. References reconnection handling or session persistence from the detail file.
      5. Mentions ECS interaction or component-based architecture concerns.
      6. Tailors research sources to listed priorities (gafferongames, Valve wiki, or similar authoritative game networking sources).
      7. Asks questions from the Domain Questions list in the detail file.
      8. Questions are specific to the project's architecture rather than generic multiplayer advice.
      9. Explicitly cites or attributes constraints to the detail file content.
      10. Testing without real latency or local simulation strategies are addressed.

      Scoring: count YES answers. 0-2=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5.

  - input: "Write a unit test for the createDefu function that verifies custom merge behavior."
    criteria: |
      AUTOMATIC FAIL (score 1): Agent reads grill-context.md or references game engine concepts during a simple testing task.

      Score each YES/NO independently:
      1. Agent does NOT read grill-context.md.
      2. Agent does NOT reference game engine domain concepts (tick rate, ECS, multiplayer).
      3. Agent does NOT mention the steering pointer or acknowledge its existence.
      4. Agent focuses entirely on the defu codebase and its merge functionality.
      5. Agent writes a test (or outlines one) for createDefu custom merge behavior.
      6. Test covers a meaningful merge scenario (custom merger function, override behavior).
      7. Agent reads relevant defu source code to understand createDefu signature.
      8. Test uses the project's existing test framework/conventions.
      9. Test assertions verify the custom merge behavior specifically.
      10. Output is clean and proportional — no unnecessary preamble or unrelated context.

      Scoring: count YES answers. 0-2=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5.

# Flakiness triage 2026-07-18: task 1 is a restraint CONTROL — its baseline is at
# ceiling (5.00) by construction, so it halves achievable delta; one restraint
# violation ([1,5,5] trial) swings the aggregate 0.67. t12 PASS (4.50) / t09 FAIL
# (3.83) came from exactly one such violation. trials 3→5 dampens single-outlier
# swings; thresholds unchanged (they measure the right thing).
trials: 5
threshold: 3.0
delta_threshold: 1.0
timeout: 120
tags: [mechanism-eval, steering-pointer, customization]
