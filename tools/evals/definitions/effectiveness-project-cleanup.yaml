id: effectiveness-project-cleanup  # immutable — survives renames; never change once results reference it
name: effectiveness-project-cleanup
description: "Does the skill correctly detect role violations, apply the disambiguation gate, route content, and fix mechanical issues?"
skill: project-cleanup
fixture: project-cleanup-workspace

conditions:
  with-skill:
    skills: [project-cleanup]
  baseline:
    skills: []

tasks:
  - name: full-cleanup-orchestration
    input: "This project needs cleanup before I hand off. Run through it and fix what you find."
    criteria: |
      Score by counting independently verified checks (YES = observed in output, NO = absent):

      DETECTION (did it find the issues?):
      □ Read .memory/CONTEXT.md and identified entries that don't belong
      □ Read AGENTS.md and identified the Terms section as misplaced glossary content
      □ Read AGENTS.md and identified Architecture section as over-length inline content (>10 lines)
      □ Identified stale scratch files (old-handoff.md is done, research-note.md is one-time)
      □ Detected plan-ticket drift (ticket 01 done but plan says "in progress")

      CORRECT ACTION (did it fix correctly?):
      □ CONTEXT.md: kept Widget, Pipeline, Envelope, Deployment target (genuine disambiguation)
      □ CONTEXT.md: removed/routed gotchas (PowerShell StrictMode, Two-step import, mise pre-release)
      □ CONTEXT.md: removed/routed specs (Context loading strategy, Identity hash, Shadow study)
      □ AGENTS.md: removed Terms section (or moved terms to CONTEXT.md)
      □ AGENTS.md: extracted Architecture to .memory/specs/ (or flagged for extraction)
      □ Deleted or proposed deleting stale scratch files
      □ Fixed plan.md to reflect ticket 01 as done

      METHODOLOGY:
      □ Mentioned subagent dispatch (or fresh-context benefit) for CONTEXT.md/AGENTS.md review

      AUTOMATIC FAIL (score 1): Says "looks fine" without reading files, or addresses only one artifact type.

      Scoring: 0-2 checks = 1, 3-4 = 2, 5-7 = 3, 8-10 = 4, 11-13 = 5

  - name: context-md-gate-only
    input: "Review .memory/CONTEXT.md and enforce the glossary scope. Apply the disambiguation test to each entry."
    criteria: |
      Score by counting independently verified checks (YES = observed in output, NO = absent):

      GATE APPLICATION (did it test each entry?):
      □ Explicitly applied a disambiguation question to entries (not just "this looks like a spec")
      □ Stated the test: resolves which meaning vs describes how something works

      CORRECT CLASSIFICATION:
      □ KEPT: Widget (genuine term — UI widget vs dashboard widget vs hardware)
      □ KEPT: Pipeline (genuine term — CI vs data vs rendering)
      □ KEPT: Envelope (genuine term — SOAP vs email vs this project's wrapper)
      □ KEPT: Deployment target (genuine term — cloud vs filesystem path)
      □ REMOVED: PowerShell StrictMode (gotcha, not disambiguation)
      □ REMOVED: Two-step import pattern (procedure, not disambiguation)
      □ REMOVED: mise pre-release versions (gotcha, not disambiguation)
      □ REMOVED: Not going public (decision, not disambiguation)
      □ REMOVED: Context loading strategy (describes HOW, not resolves WHICH MEANING)
      □ REMOVED: Identity hash (describes HOW, not resolves WHICH MEANING)
      □ REMOVED: Shadow study (describes HOW, not resolves WHICH MEANING)

      ROUTING (did removals go to correct destinations?):
      □ Gotchas routed to AGENTS.md Constraints (or staged for it)
      □ Specs routed to .memory/specs/ (or deletion)
      □ Decision routed to ADR consideration (or AGENTS.md Constraints)

      AUTOMATIC FAIL (score 1): Keeps all entries as-is, or removes entries without routing.

      Scoring: 0-3 checks = 1, 4-6 = 2, 7-9 = 3, 10-12 = 4, 13-15 = 5

trials: 3
threshold: 3.0
delta_threshold: 1.0
timeout: 180
tags: [skill-effectiveness, knowledge-routing, orchestration]
