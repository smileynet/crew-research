id: code-review-two-axis-effectiveness  # immutable — survives renames; never change once results reference it
name: code-review-two-axis-effectiveness
description: "Does the code-review skill evaluate against BOTH coding standards AND the originating spec?"
skill: code-review
fixture: defu

conditions:
  with-skill:
    skills: [code-review]
  baseline:
    skills: []

tasks:
  - input: |
      Review this diff. The spec says: "Add a rate limiter that returns 429 after 100 requests per minute per IP."

      ```diff
      +app.use((req, res, next) => {
      +  const ip = req.ip;
      +  const now = Date.now();
      +  if (!rateLimits[ip]) rateLimits[ip] = [];
      +  rateLimits[ip] = rateLimits[ip].filter(t => now - t < 60000);
      +  if (rateLimits[ip].length >= 100) {
      +    return res.status(429).json({ error: 'Too many requests' });
      +  }
      +  rateLimits[ip].push(now);
      +  next();
      +});
      ```
    criteria: |
      AUTOMATIC FAIL (score 1): Only checks one axis — either says "looks fine, matches spec" without quality review, or only flags code issues without checking spec.

      CHECKLIST (score each YES/NO independently):
      1. Explicitly addresses the SPEC axis (does it implement 100 requests/min/IP correctly?)
      2. Confirms the spec requirement IS met (the logic correctly implements 100/min/IP with sliding window)
      3. Explicitly addresses the STANDARDS axis (code quality, maintainability, security)
      4. Flags memory leak from unbounded rateLimits object (no cleanup of old IPs)
      5. Notes req.ip trust issue (X-Forwarded-For behind proxy)
      6. Notes no persistence (restart clears all rate limit state)
      7. Mentions distributed deployment concern (per-instance state doesn't scale)
      8. Provides a clear verdict (APPROVE, CHANGES REQUESTED, or equivalent)
      9. Both axes are developed with specifics (not just "code looks ok, matches spec")
      10. Separates spec findings from standards findings (distinct sections or clear labeling)

      SCORING: 0-2 checks = 1, 3-4 = 2, 5-6 = 3, 7-8 = 4, 9-10 = 5

  - input: |
      Review this change. There is no spec or issue for this code — it was a quick fix.

      ```diff
      -function getUser(id) {
      -  return db.query('SELECT * FROM users WHERE id = ' + id);
      +function getUser(id) {
      +  if (!id) throw new Error('id required');
      +  return db.query('SELECT * FROM users WHERE id = ?', [id]);
       }
      ```
    criteria: |
      AUTOMATIC FAIL (score 1): Skips review because there's no spec, or fabricates spec requirements that weren't stated.

      CHECKLIST (score each YES/NO independently):
      1. Explicitly acknowledges that no spec is available for this change
      2. States it will focus on standards axis only (or equivalent framing)
      3. Identifies the security improvement (SQL injection → parameterized query)
      4. Validates the null/falsy check is appropriate input validation
      5. Does NOT fabricate spec requirements that weren't provided
      6. Provides a clear verdict (APPROVE or equivalent)
      7. Notes this is a positive change (security hardening)
      8. Considers whether the validation layer is at the right abstraction level
      9. Review is substantive (not just "LGTM" or one-liner)
      10. Distinguishes clearly between what was there before (vulnerability) and what's there now (fix)

      SCORING: 0-2 checks = 1, 3-4 = 2, 5-6 = 3, 7-8 = 4, 9-10 = 5

  - input: |
      Review this diff. The spec says: "Users should be able to delete their account and all associated data within 30 days per GDPR requirements."

      ```diff
      +router.delete('/account', auth, async (req, res) => {
      +  await User.findByIdAndDelete(req.user.id);
      +  res.json({ message: 'Account deleted' });
      +});
      ```
    criteria: |
      AUTOMATIC FAIL (score 1): Says "implements the spec" without noticing the implementation gaps.

      CHECKLIST (score each YES/NO independently):
      1. Identifies that "all associated data" is NOT deleted (only the User record)
      2. Lists specific data types that should be deleted (orders, comments, uploads, etc.)
      3. Identifies missing 30-day soft-delete mechanism (this is immediate hard delete)
      4. Notes missing audit trail for GDPR compliance
      5. Flags missing error handling (what if findByIdAndDelete fails?)
      6. Flags missing transaction (partial deletion leaves orphaned data)
      7. Provides a clear verdict (CHANGES REQUESTED or NEEDS DISCUSSION)
      8. Distinguishes spec gaps from standards issues (two-axis structure)
      9. Notes this is an architectural concern (soft-delete approach needs design discussion)
      10. Addresses both axes — spec compliance AND code quality — with specifics for each

      SCORING: 0-2 checks = 1, 3-4 = 2, 5-6 = 3, 7-8 = 4, 9-10 = 5

trials: 3
threshold: 3.0
delta_threshold: -0.5
timeout: 180
tags: [skill-effectiveness, code-review, two-axis]
