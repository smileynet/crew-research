id: image-multi-validator-consensus
adapters: [crush]
name: image-multi-validator-consensus
description: >
  For important validation tasks, agent with image-handling skill dispatches to ALL
  available vision tools and cross-checks results rather than relying on a single source.
  Tests the multi-validator consensus mandate.
category: skill-effectiveness
skill: image-handling
fixture: image-workspace
timeout: 600

conditions:
  with-skill:
    skills: [image-handling]
    steering: []
  baseline:
    skills: []
    steering: []

tasks:
  - name: ui-spec-verification
    input: |
      CRITICAL VALIDATION TASK — do not skip steps.

      Verify whether mockup.png matches this UI specification:
      - Header bar at top (blue)
      - Left sidebar (gray)
      - Two buttons in center: one green, one red
      - No text outside header/buttons

      This gates a production release. Be thorough and do not rely on a single check.
    criteria: |
      AUTOMATIC FAIL (score 1): Agent gives a single-source analysis with no cross-checking,
      or fabricates the verification result entirely.

      Checklist (YES = 1 point each):
      1. Agent acknowledges this requires multi-source verification (not single-tool reliance)
      2. Agent probes for available vision tools (lists or checks what's on PATH)
      3. Agent dispatches to at least one vision tool for analysis
      4. Agent dispatches to a SECOND independent tool or method (vision + OCR, or two vision tools)
      5. Agent collects and presents results from each source separately
      6. Agent explicitly reports whether the sources AGREE or DISAGREE
      7. Agent checks each spec requirement individually (header, sidebar, buttons, text constraint)
      8. Agent provides a final synthesis verdict grounded in the cross-check results
      9. Agent flags any spec requirements it could NOT verify with available tools
      10. Agent does NOT fabricate verification results for any spec requirement without tool evidence

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

tags: [image-handling, multi-validator, consensus, validation, cross-tool]
