id: eval-criteria-improves-scoring  # immutable — survives renames; never change once results reference it
name: eval-criteria-improves-scoring
skill: eval-criteria
category: skill-effectiveness

tasks:
  - input: "Write an eval definition that tests whether a code review agent catches security vulnerabilities in pull requests."
    criteria: |
      AUTOMATIC FAIL (score 1): No structured criteria at all, OR criteria tests multiple unrelated things in one eval.

      CHECKLIST (score each YES/NO independently):
      1. Output contains a PRIMARY statement (what the eval measures)
      2. Output contains an AUTOMATIC FAIL condition (what earns score 1)
      3. Output contains at least two score anchors (intermediate score levels)
      4. Tests ONE signal per eval (not bundling unrelated behaviors)
      5. Uses countable/observable language (not subjective "should handle well")
      6. Follows naming convention (kebab-case id, descriptive name)
      7. Includes realistic task input (a code snippet or PR diff to review)
      8. Threshold matches the eval's criticality (not arbitrary)
      9. Criteria distinguish between partial and full detection (graduated difficulty)
      10. AUTOMATIC FAIL is the inverse of the PRIMARY (clear logical connection)

      SCORING: 0-2 checks = 1, 3-4 = 2, 5-6 = 3, 7-8 = 4, 9-10 = 5

runs:
  with_skill: true
  without_skill: true

threshold: 3.0
delta_threshold: 0
timeout: 90
tags: [skill-effectiveness, meta-eval]
