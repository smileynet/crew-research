    expect_activation: false
  - input: "Deploy the staging environment to AWS."
    expect_activation: false
  - input: "Write a migration script to add the email_verified column."
    expect_activation: false
  - input: "Generate a UUID in Python."
    expect_activation: false
  # adjacent-skill decoys: share "review/check" vocabulary but belong to a neighboring skill
  - input: "Dispatch an independent Codex reviewer to check all our changes and file findings."
    expect_activation: false
  - input: "Review all the new work since the last review marker and resume from there."
