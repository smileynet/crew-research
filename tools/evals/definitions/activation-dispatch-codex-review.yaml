    expect_activation: true
  - input: "Audit all work with Codex and tell me which high-priority ticket it files."
    expect_activation: true
  - input: "Check whether the independent Codex review returned clean or ticketed."
    expect_activation: true
  - input: "Get an independent review of all the changes we made today."
    expect_activation: true
  - input: "Have another AI check our work before we merge."
    expect_activation: true
  - input: "Review the latest commit yourself."
    expect_activation: false
  - input: "Fix the existing Codex findings ticket."
    expect_activation: false
  - input: "Show the next ready ticket."
    expect_activation: false
  - input: "Create a code review checklist."
    expect_activation: false
  - input: "Resume a historical review without dispatching another agent."
    expect_activation: false

threshold: 3.5
timeout: 60
