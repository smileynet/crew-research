id: context-budget-effectiveness  # immutable — survives renames; never change once results reference it
name: context-budget-effectiveness
skill: context-budget-awareness
category: skill-effectiveness
fixture: defu-research

conditions:
  with-skill:
    skills: [context-budget-awareness]
  baseline:
    skills: []

tasks:
  - input: "Research how defu handles circular references (read the source and tests), then plan a fix if it doesn't handle them, then implement it with tests."
    criteria: |
      AUTOMATIC FAIL (score 1): Agent loses track of the objective, repeats searches from phase 1 during phase 3, or contradicts earlier findings.

      Score each YES/NO independently:
      1. Completes all three phases (research, plan, implement).
      2. Summarizes research findings before transitioning to planning phase.
      3. Summarizes plan before transitioning to implementation phase.
      4. Does NOT carry raw source dumps or verbose exploration into later phases.
      5. Restates the objective at phase transitions.
      6. Phase 1 findings become one-line references by phase 3 (decaying resolution).
      7. Does NOT repeat file reads or searches already performed in earlier phases.
      8. Reinforces constraints (e.g., "don't break existing behavior") before implementation.
      9. Implementation phase references plan decisions without re-deriving them.
      10. Final output is coherent — implementation matches the plan which matches the research.

      Scoring: count YES answers. 0-2=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5.

  - input: "Add support for merging Map objects in defu. Requirements: preserve existing Map entries, handle nested Maps, add tests. Important constraint: do NOT modify the existing merge behavior for plain objects."
    criteria: |
      AUTOMATIC FAIL (score 1): Modifies existing plain object merge behavior or never references the constraint after initial reading.

      Score each YES/NO independently:
      1. Acknowledges the constraint (do NOT modify plain object behavior) before starting implementation.
      2. Re-states or reinforces the constraint at least once during implementation.
      3. Implements Map merging that preserves existing Map entries.
      4. Handles nested Maps (recursive merge).
      5. Adds tests for the new Map merging behavior.
      6. Verifies existing tests still pass (runs test suite or explicitly checks).
      7. Implementation is scoped — only touches Map-related code paths.
      8. Does NOT carry verbose research or exploration into the implementation section.
      9. Distinguishes Map handling from plain object handling in the code.
      10. Final code does not alter the existing merge paths for non-Map values.

      Scoring: count YES answers. 0-2=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5.

  - input: "I have research findings about Set merging patterns in .scratch/research/set-handling.md. Use those findings to implement Set merging in defu with full test coverage."
    criteria: |
      AUTOMATIC FAIL (score 1): Quotes or references the entire research file verbatim in reasoning without summarization.

      Score each YES/NO independently:
      1. Reads the research file (.scratch/research/set-handling.md).
      2. Extracts relevant patterns from the file rather than using it wholesale.
      3. Summarizes key points before starting implementation.
      4. Does NOT re-read the file during implementation (works from the summary).
      5. Explicitly states what's relevant and what's irrelevant from the findings.
      6. Implementation follows the extracted patterns without research artifacts in code comments.
      7. Adds comprehensive test coverage for Set merging.
      8. Does NOT carry raw research prose into implementation reasoning.
      9. Uses a structured summary as implementation reference.
      10. Final implementation is clean — no research commentary, just working code and tests.

      Scoring: count YES answers. 0-2=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5.

threshold: 3.0
delta_threshold: 0
timeout: 300
tags: [skill-effectiveness, context-budget, efficiency]
