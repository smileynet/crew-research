id: architecture-design-vocabulary-effectiveness  # immutable — survives renames; never change once results reference it
name: architecture-design-vocabulary-effectiveness
description: "Does the architecture-deepening skill use consistent deep-module vocabulary (module, interface, depth, seam, adapter, leverage, locality)?"
skill: architecture-deepening
fixture: defu

conditions:
  with-skill:
    skills: [architecture-deepening]
  baseline:
    skills: []

tasks:
  - input: |
      I have a UserService class that handles registration, authentication, password reset, profile updates, and notification preferences. It's 800 lines long. Every controller calls it for different things. How should I restructure it?
    criteria: |
      AUTOMATIC FAIL (score 1): Generic advice ("split it up") without architectural reasoning or consistent terminology.

      Score each independently YES/NO:
      1. Diagnoses the class as SHALLOW (wide interface, callers must know too much)
      2. Uses the term SEAM to identify natural split boundaries
      3. Identifies specific seams (auth vs profile vs notifications or similar)
      4. Discusses DEPTH (rich behavior behind narrow interface) as the goal
      5. Mentions INTERFACE size or width as a measurable problem
      6. Uses LEVERAGE concept (fewer things callers need to know per module)
      7. Applies DELETION TEST or similar to validate the split
      8. Vocabulary is used consistently throughout (not just once)
      9. Proposes concrete restructuring with ≥2 resulting modules named
      10. Explains why the proposed modules are DEEPER than the original

      Scoring: 0-2 YES = 1, 3-4 YES = 2, 5-6 YES = 3, 7-8 YES = 4, 9-10 YES = 5.
      AUTOMATIC FAIL overrides all other scoring.

  - input: |
      We have an EventEmitter that 15 different modules subscribe to. Any module can emit any event. It's impossible to trace what happens when an event fires. Should we refactor this?
    criteria: |
      AUTOMATIC FAIL (score 1): Says "event emitters are fine" or "just add TypeScript types" without analyzing the architectural issue.

      Score each independently YES/NO:
      1. Identifies the EventEmitter as a SHALLOW seam (interface is "any string" → no depth)
      2. Notes the current interface is infinitely wide (any event name accepted)
      3. Mentions LOCALITY as a goal (when something breaks, you know where to look)
      4. Proposes explicit interfaces at each SEAM (typed channels or domain events)
      5. Uses DEEP module concept (rich behavior behind narrow, typed interface)
      6. Applies "one adapter = hypothetical, two = real" reasoning for seam extraction
      7. Discusses how the refactoring increases DEPTH (more behavior per interface point)
      8. Vocabulary is used consistently throughout (not just once)
      9. Proposes a concrete alternative architecture (not just "refactor")
      10. Explains tradeoffs of the proposed approach (what you gain vs cost of change)

      Scoring: 0-2 YES = 1, 3-4 YES = 2, 5-6 YES = 3, 7-8 YES = 4, 9-10 YES = 5.
      AUTOMATIC FAIL overrides all other scoring.

trials: 3
threshold: 3.0
delta_threshold: 0.5
timeout: 120
tags: [skill-effectiveness, architecture, vocabulary]
