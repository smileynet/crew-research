id: handoff-decaying-resolution  # immutable — survives renames; never change once results reference it
name: handoff-decaying-resolution
description: "Does the handoff skill produce compressed, phase-aware handoffs that decay old context?"
skill: handoff
fixture: defu

conditions:
  with-skill:
    skills: [handoff]
  baseline:
    skills: []

tasks:
  - input: |
      We've been working on defu for 3 sessions. Here's what happened:
      - Session 1: Researched how other merge libraries work (lodash.merge, deepmerge, Object.assign). Decided on recursive approach. Wrote ADR.
      - Session 2: Implemented core merge, added tests for plain objects, arrays, null handling. Found a bug with circular references, decided to punt it.
      - Session 3 (current): Added TypeScript types, fixed the array merge strategy to concat instead of replace, added 5 new tests all passing.

      Write a handoff for the next session.
    criteria: |
      AUTOMATIC FAIL (score 1): Handoff is >80 lines or includes full detail from all 3 sessions equally.

      Score each YES/NO independently:
      1. Handoff is under 60 lines total.
      2. Session 1 is compressed to 1-2 lines (outcomes/decisions only, no exploration detail).
      3. Session 2 is compressed to 2-3 lines (outcomes/decisions only, e.g. "circular refs punted").
      4. Session 3 (current) retains full detail in the In-Flight section: TypeScript types added, array merge fix (concat), 5 new tests passing.
      5. Handoff points to the next action (an in_flight_ticket value, an in-progress ticket, or explicitly "none").
      6. Handoff includes evidence pointers (test output, files changed) or base_commit placeholder.
      7. Older sessions are visually separated or labeled as prior/decayed context.
      8. Handoff includes a handoff_key or session identifier.
      9. Current work (In-Flight) includes specific file paths or code locations touched.
      10. Format follows a structured template (Focus/In-Flight/Fog/Constraints sections) rather than prose.

      Scoring: count YES answers. 0-2=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5.

  - input: |
      Write a handoff. This session I fixed a failing test in defu — the 'should handle nested arrays' test was broken because the merge function wasn't recursing into array elements. I also ran the full test suite (23 tests pass) and pushed to main.
    criteria: |
      AUTOMATIC FAIL (score 1): Handoff is >60 lines for what was a single bug fix, or missing evidence (test output, commit SHA).

      Score each YES/NO independently:
      1. Handoff is under 40 lines.
      2. States what was fixed (nested arrays test, recursion into array elements).
      3. Includes test evidence (23 tests pass).
      4. Includes push confirmation or commit reference.
      5. Points to the next action (in_flight_ticket / in-progress ticket) or explicitly states "none needed".
      6. Includes base_commit or handoff_key.
      7. No unnecessary sections or padding for a single-fix session.
      8. Includes file paths or code locations of the fix.
      9. Format follows a structured template (Focus/In-Flight/Fog/Constraints, not prose paragraphs).
      10. Proportional to work done — concise for a small fix, no bloat.

      Scoring: count YES answers. 0-2=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5.

# 2026-07-22 (ticket 28): trials 3->5 — variance remedy per steering-pointer precedent;
# def classified FLAKY (straddles gate across runs at unchanged content).
trials: 5
threshold: 3.0
delta_threshold: 0.75
timeout: 120
tags: [skill-effectiveness, session-management]
