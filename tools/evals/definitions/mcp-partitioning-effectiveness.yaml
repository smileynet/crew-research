id: mcp-partitioning-effectiveness  # immutable — survives renames; never change once results reference it
name: mcp-partitioning-effectiveness
description: "Does mcp-partitioning skill produce correct partitioning advice — placement rule, zero-tools trap, sentinel-probe validation — vs generic 'remove some servers' advice?"
skill: mcp-partitioning

conditions:
  with-skill:
    skills: [mcp-partitioning]
  baseline:
    skills: []

tasks:
  - name: bloated-global-config
    input: |
      My kiro-cli setup has 9 MCP servers in the global config — internal search, AWS APIs, Slack, Salesforce, Jira, GitHub, a diagramming server, a database inspector, and a docs generator. Every session loads all of them (~230 tools) and sessions feel slow, with the model sometimes picking the wrong tool. I use internal search and AWS in almost every session; the rest are occasional. How should I reorganize this?
    criteria: |
      CHECKLIST (score each YES=1, NO=0):
      1. Identifies usage frequency as the partitioning criterion (high-frequency servers stay in default, occasional ones move out)
      2. Keeps internal search and AWS in the global/default config specifically (the two high-frequency servers)
      3. Proposes moving occasional servers into named specialist agents (not just disabling them)
      4. Groups specialist agents by domain (e.g., comms, data, ops — not one agent per server)
      5. States a generalizable placement rule for future servers (e.g., "specialist unless used in most sessions")
      6. Provides a concrete mechanism to reach specialists from the default session (subagent dispatch, --agent flag, or agent swap)
      7. Mentions tool-selection degradation rationale (too many tools hurts accuracy, cites ~30-50 tool threshold or similar)
      8. Recommends validating the reorganization with a live probe rather than trusting config file inspection
      9. Suggests a negative probe (confirm default agent cannot reach specialist tools)
      10. Notes the specific server count reduction in default (from 9 to 2-3)

      AUTOMATIC FAIL (score 1): Advice is only "remove/disable some servers" or "use fewer tools" with no agent-based partitioning scheme.

      SCORING: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - name: zero-tools-agent-config
    input: |
      I created a kiro-cli agent config for a "comms" specialist agent and listed the Slack and Outlook MCP servers under mcpServers. The JSON is valid and kiro loads the agent without errors, but when I ask it to send a Slack message it says it has no such tool. The same servers work fine in my default session. What's likely wrong, and how do I confirm the fix actually worked?
    criteria: |
      CHECKLIST (score each YES=1, NO=0):
      1. Identifies the tools whitelist/allowlist as the likely root cause (agent loads zero MCP tools without an explicit tools list)
      2. Explains that mcpServers alone is insufficient — a tools whitelist (e.g., ["@builtin", "@slack"]) is required
      3. Provides the specific fix (add a tools/allowedTools entry listing the server's tools)
      4. Prescribes verification via a live session probe (not just re-reading config)
      5. Uses a deterministic verification method (exact sentinel word on success, not free-form "try it")
      6. Mentions a negative probe (confirm default agent cannot reach the specialist's tools, or confirm failure mode before fix)
      7. Covers a second config pitfall (global-config inheritance opt-in, whitelist gating inherited servers, or similar)
      8. Distinguishes this from common red herrings (JSON syntax, reinstall, restart are NOT the issue)
      9. Explains WHY this fails silently (no error because the config is technically valid)
      10. Suggests an anti-vacuous check (deliberately break something to confirm the test itself works)

      AUTOMATIC FAIL (score 1): Generic debugging advice (reinstall, check JSON syntax, restart) with no mention of a tools whitelist/allowlist gating mechanism.

      SCORING: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - name: validate-partition-after-trim
    input: |
      I just finished trimming my kiro-cli setup: the default session now has only 2 essential MCP servers, and I moved the other 7 into three specialist agents (ops, comms, data). Everything looks right in the config files. Give me a concrete test plan to confirm the partition actually works before I recommend this setup to my team.
    criteria: |
      CHECKLIST (score each YES=1, NO=0):
      1. Uses live session probes (actually invoke the agent and test behavior, not just read config)
      2. Includes positive probes for each specialist agent (confirm each loads its expected tools)
      3. Includes a negative probe on the default agent (confirm it CANNOT reach specialist tools)
      4. Demands exact sentinel replies (deterministic verification, not free-form prose answers)
      5. Tests the default agent loads its 2 essential servers correctly (positive probe on default)
      6. Includes an anti-vacuous drill (deliberately violate the partition and confirm the check catches it)
      7. Structures the plan as repeatable steps (not ad-hoc — could be run by a teammate)
      8. Covers team-distribution safety (don't overwrite teammate configs, backup, or force-flag)
      9. Tests cross-agent isolation (specialists cannot reach each other's tools, not just default isolation)
      10. Specifies what a FAILURE looks like for each probe (not just what success looks like)

      AUTOMATIC FAIL (score 1): The plan is only "open a session and check the tools list" or config-file inspection — no behavioral probes.

      SCORING: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

trials: 3
threshold: 3.0
delta_threshold: 0.75
timeout: 120
tags: [skill-effectiveness, mcp, agent-config]
