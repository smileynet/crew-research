id: grounded-eval-criteria  # immutable — survives renames; never change once results reference it
name: grounded-eval-criteria
skill: eval-criteria
category: skill-effectiveness
fixture: defu

tasks:
  - input: "Write an eval definition (YAML) that tests whether an AI agent correctly handles adding a new feature to the defu project (in project/ directory). The feature: a `defuNoArray` variant that replaces arrays instead of concatenating them."
    criteria: |
      AUTOMATIC FAIL (score 1): No structured criteria, OR criteria tests multiple unrelated things.

      Checklist (YES = 1 point each):
      1. Output contains a PRIMARY statement declaring the single signal being tested
      2. Output contains an AUTOMATIC FAIL condition with specific observable trigger
      3. Output contains at least two score anchors (numbered levels with behavior descriptions)
      4. Criteria tests ONE coherent signal (not multiple unrelated behaviors)
      5. Language is countable/observable (references specific actions, files, or outputs — not "correctly" or "properly")
      6. AUTOMATIC FAIL describes a concrete behavior (not just "bad response")
      7. Score anchors use graduated specificity (higher scores = more specific behaviors)
      8. Output follows YAML eval definition structure (id, tasks, criteria fields)
      9. Criteria references the specific feature context (defuNoArray, array merging)
      10. Output includes threshold that matches the criticality of the behavior tested

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - input: "Write eval criteria for testing whether an agent properly diagnoses a type error in the defu project's src/types.ts file. The eval should check that the agent reads the types before proposing changes."
    criteria: |
      AUTOMATIC FAIL (score 1): Criteria is vague ("should handle types well") with no observable checks.

      Checklist (YES = 1 point each):
      1. Criteria includes a check for whether the agent READ the file before acting
      2. The "read before act" check is observable (e.g., "agent references specific type names from the file")
      3. AUTOMATIC FAIL is defined for acting without reading
      4. Criteria references specific file (src/types.ts) or specific type names
      5. Score anchors describe graduated levels of file-reading thoroughness
      6. Language is countable — avoids "properly", "correctly", "well" without definition
      7. Criteria tests a single coherent signal (read-then-act, not multiple behaviors)
      8. Higher score levels require citing specific content from the file (not just opening it)
      9. Output has structured format (PRIMARY + AUTOMATIC FAIL + score anchors)
      10. Criteria distinguishes between "opened the file" and "understood and referenced its content"

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - input: "Review this eval criteria and improve it: 'PRIMARY: Agent should fix the bug correctly. AUTOMATIC FAIL: Agent breaks something.' Make it specific to testing a fix in the defu project's array merging logic."
    criteria: |
      AUTOMATIC FAIL (score 1): Returns the same vague criteria unchanged or equally vague.

      Checklist (YES = 1 point each):
      1. Replaces "fix the bug correctly" with a specific observable signal
      2. Replaces "breaks something" with a concrete failure condition (e.g., "modifies unrelated files", "tests fail")
      3. New criteria references specific code location (array merging logic, relevant file/function)
      4. New criteria includes countable checks (not subjective assessments)
      5. New criteria has graduated score anchors (not just pass/fail)
      6. Score anchors reference specific behaviors tied to the defu codebase
      7. AUTOMATIC FAIL is now specific and observable (a judge could verify YES/NO)
      8. New criteria includes PRIMARY statement with one clear signal
      9. Improved criteria explains WHY the original was vague (teaches the pattern)
      10. New criteria includes examples of what each score level looks like

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

runs:
  with_skill: true
  without_skill: true

threshold: 3.0
delta_threshold: 0
timeout: 180
tags: [skill-effectiveness, meta-eval, grounded]
