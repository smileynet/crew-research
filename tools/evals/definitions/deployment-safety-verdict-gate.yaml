id: deployment-safety-verdict-gate  # immutable — survives renames; never change once results reference it
name: deployment-safety-verdict-gate
description: "Does deployment-safety skill produce an explicit DEPLOY CONFIRMED/HOLD/ROLLBACK verdict after verification steps?"
fixture: defu

conditions:
  with-skill:
    skills: [deployment-safety]
  baseline:
    skills: []

tasks:
  - name: clear-success-verdict
    input: |
      I just deployed a database migration that adds an index to the orders table (CREATE INDEX CONCURRENTLY on a 50M row table, PostgreSQL 15, AWS RDS).

      Here's the post-deploy status:
      - Index creation took 4 minutes
      - Health endpoint still responds
      - No errors in CloudWatch
      - Latency looks normal, no increase in error rate
      - The new index is showing up in EXPLAIN plans for the target queries

      Give me your assessment — is this deployment successful?
    criteria: |
      AUTOMATIC FAIL (score 1): No verdict — ends with open-ended commentary like "looks good" or "you should be fine."

      CHECKLIST (score each YES/NO independently):
      1. Contains an explicit verdict keyword (DEPLOY CONFIRMED, CONFIRMED, SUCCESS, or equivalent clear declaration)
      2. Verdict is clearly distinguished from surrounding text (not buried in a paragraph)
      3. References specific evidence from the provided status (not generic advice)
      4. Mentions the health endpoint passing as supporting evidence
      5. Mentions the EXPLAIN plan confirmation as supporting evidence
      6. Mentions the absence of errors/latency increase as supporting evidence
      7. States what to monitor going forward (next hours/days)
      8. Indicates when the deployment can be considered fully stable (time horizon)
      9. Assessment is structured (not just a wall of text)
      10. Does not hedge excessively (e.g., "probably fine but who knows") — commits to a position

      SCORING: 0-2 checks = 1, 3-4 = 2, 5-6 = 3, 7-8 = 4, 9-10 = 5

  - name: ambiguous-situation-verdict
    input: |
      I'm doing a rolling deploy of a new payment service version (handles 2000 req/s at peak, 4 pods).

      Current state after deploying 2 of 4 pods:
      - Health checks passing on both new pods
      - 5% increase in p99 latency on new pods (120ms → 126ms)
      - Old pods still at baseline latency
      - Error rate unchanged across all pods

      What's your verdict — should I continue the rollout?
    criteria: |
      AUTOMATIC FAIL (score 1): Says "all good, continue" without acknowledging the latency signal.

      CHECKLIST (score each YES/NO independently):
      1. Contains an explicit verdict (HOLD, conditional PROCEED, or equivalent clear position)
      2. Acknowledges the 5% p99 latency increase as a signal worth noting
      3. Provides reasoning for the verdict (why proceed OR why hold)
      4. States a specific threshold or condition that would change the verdict
      5. Specifies a monitoring duration before full confirmation (e.g., "wait 5 more minutes")
      6. Distinguishes between acceptable degradation vs concerning signal
      7. References the error rate being unchanged as supporting evidence
      8. Considers what would warrant a ROLLBACK (explicit trigger condition)
      9. Acknowledges the partial state (2 of 4 pods) in the reasoning
      10. Verdict is structured and actionable (not just "it depends")

      SCORING: 0-2 checks = 1, 3-4 = 2, 5-6 = 3, 7-8 = 4, 9-10 = 5

threshold: 3.0
delta_threshold: 0
trials: 3
timeout: 120
tags: [effectiveness, deployment, verdict-gate]
