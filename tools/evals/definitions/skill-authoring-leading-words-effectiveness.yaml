id: skill-authoring-leading-words-effectiveness  # immutable — survives renames; never change once results reference it
name: skill-authoring-leading-words-effectiveness
description: "Does the skill-authoring skill guide authors to use leading words — compact pretrained concepts that anchor agent behavior?"
skill: skill-authoring
fixture: defu

conditions:
  with-skill:
    skills: [skill-authoring]
  baseline:
    skills: []

tasks:
  - input: |
      I'm writing a skill for code cleanup. My description currently says: "Use when code needs to be made shorter, simpler, more readable, better organized, less redundant, and easier to understand." How can I improve this?
    criteria: |
      CHECKLIST (score each YES=1, NO=0):
      1. Identifies the description as verbose/redundant (multiple words restating the same concept)
      2. Points out specific redundancies (shorter/simpler/readable/easier-to-understand overlap)
      3. Proposes collapsing to 1-2 leading words (e.g., "refactor", "hygiene", "cleanup")
      4. Explains that compact trigger keywords activate more reliably than verbose lists
      5. Mentions context budget cost of verbose descriptions (wastes tokens loaded every turn)
      6. Discusses the concept of "leading words" or pretrained concepts explicitly
      7. Explains that leading words recruit behavior the model already knows from pretraining
      8. Provides specific word suggestions with rationale for each
      9. Distinguishes between distinctive triggers and generic synonyms
      10. Notes that the original description would fire too broadly (every code task involves "readable" code)

      AUTOMATIC FAIL (score 1): Says the description is fine, or only suggests minor word changes without addressing the core verbosity/redundancy issue.

      SCORING: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - input: |
      I'm writing a debugging skill body and I keep writing "the loop should be fast, deterministic, and produce a clear binary signal with low overhead." This phrase appears 3 times. What should I do?
    criteria: |
      CHECKLIST (score each YES=1, NO=0):
      1. Identifies the repetition as a problem (same phrase 3 times wastes tokens)
      2. Proposes a LEADING WORD that collapses the entire phrase (e.g., "tight" as in "tight feedback loop")
      3. The proposed word is a real pretrained concept (not invented jargon/neologism)
      4. Explains the define-once-use-as-shorthand pattern (state the word's meaning once, then reference it)
      5. Explains that leading words recruit priors from pretraining (the model already knows what "tight" means)
      6. Notes the anti-pattern of invented jargon (neologisms don't recruit any pretrained behavior)
      7. Identifies which concepts the phrase collapses (fast + deterministic + binary signal + low overhead = one idea)
      8. Proposes the specific replacement with evidence it's pretrained (commonly used in the same context)
      9. Addresses token efficiency (3 repetitions of a long phrase vs. 3 uses of one word)
      10. Does NOT just say "remove duplicates" — proposes a semantic compression, not deletion

      AUTOMATIC FAIL (score 1): Says "just remove the duplicates" without proposing a replacement concept or leading word.

      SCORING: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

trials: 3
threshold: 3.0
delta_threshold: 0.5
timeout: 120
tags: [skill-effectiveness, skill-authoring, leading-words]
