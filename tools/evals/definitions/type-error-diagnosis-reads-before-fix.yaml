id: type-error-diagnosis-reads-before-fix  # immutable — survives renames; never change once results reference it
name: type-error-diagnosis-reads-before-fix
skill: feedback-loop-debugging
category: skill-effectiveness
fixture: defu

tasks:
  - name: read-types-before-changing-merge
    input: |
      I'm getting a TypeScript error: 'Type string is not assignable to type never' when calling
      defu({ tags: ['a'] }, { tags: ['b'] }). The runtime works fine but tsc rejects it. Fix the types.
    criteria: |
      AUTOMATIC FAIL (score 1): Proposes changes to type definitions (MergeObjects, Merge, MergeArrays, Defu) without first reading src/types.ts.

      Binary checklist — award one point per YES:
      1. Agent reads src/types.ts BEFORE proposing any changes
      2. Agent identifies the relevant type (MergeArrays or the array handling in Merge)
      3. Agent traces the error through the type chain (Defu → MergeObjects → Merge → MergeArrays)
      4. Agent correctly explains WHY string[] becomes 'never' (the conditional type logic)
      5. Proposed fix targets the specific type responsible (not a broad 'as any' or type widening)
      6. Fix preserves type safety for non-array cases
      7. Agent runs tsc (or equivalent type check) to confirm the fix compiles
      8. Agent verifies the fix doesn't break other existing type tests
      9. Agent creates or describes a minimal reproduction that triggers the error
      10. Agent shows the reproduction compiles clean after the fix

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - name: read-types-before-fixing-nullish
    input: |
      TypeScript shows 'Property x does not exist on type nullish' when accessing the result of
      defu({ x: 1 }, { y: 2 }).x — but the value is clearly there at runtime. Fix the type inference.
    criteria: |
      AUTOMATIC FAIL (score 1): Modifies type definitions without reading src/types.ts, OR suggests a non-null assertion (!) as the fix.

      Binary checklist — award one point per YES:
      1. Agent reads src/types.ts BEFORE proposing any changes
      2. Agent identifies the nullish type alias in the types
      3. Agent identifies the MergeObjects conditional branch that introduces nullish
      4. Agent explains WHY nullish leaks into the output type for this case
      5. Proposed fix distinguishes between actually-nullable keys and non-nullable keys
      6. Fix preserves null-handling for keys that are genuinely nullable
      7. Agent runs tsc or equivalent to confirm the fix works
      8. Agent tests that non-nullable key access (like .x) works after the fix
      9. Agent tests that nullable keys still correctly reflect their nullability
      10. Agent constructs multiple test cases (nullable key, non-nullable key, mixed)

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

  - name: read-types-before-fixing-recursive-depth
    input: |
      Getting 'Type instantiation is excessively deep and possibly infinite' from TypeScript
      when merging deeply nested config objects with defu. The configs are only 4 levels deep.
      Fix the recursive type issue.
    criteria: |
      AUTOMATIC FAIL (score 1): Proposes adding a depth counter or simplifying types without reading how the recursion is currently structured in types.ts.

      Binary checklist — award one point per YES:
      1. Agent reads src/types.ts BEFORE proposing any changes
      2. Agent identifies the Merge ↔ MergeObjects mutual recursion
      3. Agent explains WHY the recursion exceeds TypeScript's depth limit at 4 levels
      4. Proposed fix is structural (depth limit type parameter, conditional bail-out, or tuple-length guard) — NOT @ts-ignore or type widening to 'any'
      5. Fix does not use @ts-ignore, 'as any', or broad type widening
      6. Agent confirms the fix resolves the error on a 4-level-deep nested type
      7. Agent confirms shallow cases (1-2 levels) still infer correctly after the fix
      8. Agent creates a minimal deeply-nested type to reproduce the error
      9. Agent runs tsc to verify the fix compiles
      10. Fix preserves correct type inference for the common (non-deep) case

      Scoring: 0-2 checks=1, 3-4=2, 5-6=3, 7-8=4, 9-10=5

runs:
  with_skill: true
  without_skill: true

threshold: 3.5
delta_threshold: 0.75
timeout: 180
tags: [skill-effectiveness, debugging, types, read-before-modify]
