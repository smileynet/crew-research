[env]
CREW_TIER = "full"
CREW_TOOLS = "kiro-cli"
CREW_TICKET_SOURCES = "local,github"

[tasks.validate]
description = "Validate all compositions and cross-links"
run = """
bash tools/generator/generate.sh validate
bash tools/lint/check-crosslinks.sh
tkt validate --brief && echo "✅ tickets valid"
"""

[tasks."test:recall"]
description = "recall CLI test suite (run from recall repo)"
run = "cd ~/code/recall && cargo test"

[tasks."test:noise-floor"]
description = "Noise floor logic tests (ticket 71)"
run = "bash tools/evals/harness/test-noise-floor.sh"

[tasks."test:panel"]
description = "Judge panel accounting tests (family derivation, cross-family floor)"
run = "bash tools/evals/harness/test-panel.sh"

[tasks."check:design"]
description = "Archwright design gates: static constraint checks + link resolution"
run = """
python3 "$HOME/code/archwright/tools/archwright-check.py" --static design/specs/ | grep -E "FAIL|ERROR" && exit 1
python3 "$HOME/code/archwright/tools/archwright-check.py" --static design/specs/ | grep -cE "✓ PASS" | xargs -I{} echo "✅ {} static checks pass"
python3 "$HOME/code/archwright/tools/archwright-validate.py" --links design/ | tail -1
"""

[tasks.generate]
description = "Generate deployment for a tool"
usage = 'arg "[tool]" help="Target tool (kiro-cli, claude-code, all)" default="kiro-cli"'
run = "bash tools/generator/generate.sh generate --tool ${usage_tool:-kiro-cli}"

[tasks.init]
description = "Initialize a project or deploy globally"
raw = true
run = "bash tools/generator/init.sh"

[tasks.catalog]
description = "List available skills and tiers"
run = "bash tools/generator/catalog.sh"

[tasks.doctor]
description = "Health check for a deployment"
raw = true
run = "bash tools/generator/doctor.sh"

[tasks.eval]
description = "Run all dual-run evals (3 trials)"
run = "bash tools/evals/harness/run.sh --all --trials 3"

[tasks."eval:one"]
description = "Run a single eval definition"
usage = 'arg "<def>" help="Eval definition file"'
run = "bash tools/evals/harness/run.sh --definition ${usage_def?} --trials 3"

[tasks."eval:activation"]
description = "Run activation tests for all skills"
run = "bash tools/evals/harness/run-activation.sh --all"

[tasks."eval:experiment"]
description = "Run a multi-condition experiment"
usage = 'arg "<name>" help="Experiment name"'
run = "bash tools/evals/harness/run-experiment.sh --experiment ${usage_name?} --trials 3 --fixture defu"

[tasks.lint]
description = "Check cross-links between practices and skills"
run = "bash tools/lint/check-crosslinks.sh"

[tasks.proof]
description = "Run all proofs against kiro-cli"
run = "bash tools/proofs/harness/run.sh --adapter kiro-cli --all"

[tasks."proof:recall"]
description = "Run recall correctness proofs (from recall repo)"
run = "cd ~/code/recall && cargo test --test proofs"

[tasks.validate-deployment]
description = "End-to-end deployment validation"
run = "bash tools/evals/harness/validate-deployment.sh"

[tasks."eval:qualitative"]
description = "Run a qualitative (keyword-based) experiment"
usage = 'arg "<name>" help="Experiment name"'
run = "bash tools/evals/harness/run-qualitative-experiment.sh --experiment ${usage_name?} --trials 3"

[tasks."session:parse"]
description = "Parse session transcripts for metrics"
usage = 'arg "[days]" help="Days to analyze" default="7"'
run = "python tools/session-analyzer/parse.py --days ${usage_days?}"

[tasks."session:skills"]
description = "Skill activation + steering compliance report from session logs"
usage = 'arg "[days]" help="Days to analyze" default="30"'
run = "python tools/session-analyzer/skill_usage.py --days ${usage_days?}"

[tasks."session:review"]
description = "Collect self-improvement candidates (corrections/friction) from session archives — digest for human triage, never creates tickets"
usage = 'arg "[days]" help="Days to analyze" default="7"'
run = "python tools/session-analyzer/session_review.py --days ${usage_days?}"

[tasks."add-skill"]
description = "Install a project-level skill to a project's .kiro/skills/"
usage = 'arg "<name>" help="Skill slug to install"'
run = """
SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
REPO_ROOT="$(cd "$SCRIPT_DIR/../.." && pwd)"
SKILL_SRC="$REPO_ROOT/atomics/skills/${usage_name}/SKILL.md"
PROJECT="${MISE_PROJECT_DIR:-.}"
DEST="$PROJECT/.kiro/skills/${usage_name}/SKILL.md"
if [[ ! -f "$SKILL_SRC" ]]; then
  echo "Error: skill '${usage_name}' not found in $REPO_ROOT/atomics/skills/" >&2; exit 1
fi
mkdir -p "$(dirname "$DEST")"
cp "$SKILL_SRC" "$DEST"
if [[ -d "$REPO_ROOT/atomics/skills/${usage_name}/references" ]]; then
  cp -r "$REPO_ROOT/atomics/skills/${usage_name}/references" "$(dirname "$DEST")/"
fi
echo "Installed ${usage_name} → $DEST"
"""

[tasks."recall:ingest"]
description = "Run recall ingestion for all projects and sessions"
run = "recall sync"

[tasks."recall:status"]
description = "Show recall index status"
run = "recall status"

[tasks.release]
description = "Cut a tagged release (validates, updates changelog, tags, pushes, creates GH release)"
raw = true
run = "bash tools/generator/release.sh"
