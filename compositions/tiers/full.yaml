description: "Full active development lifecycle — plan, research, build, document, deploy, maintain."

steering:
  - ai-generation-hygiene
  - verification-protocol
  - project-conventions
  - source-authority
  - context-budget-awareness
  - image-handling
  - subagent-reliability
  - research-dispatch-mandate

skills:
  # Session
  - handoff
  - read-handoff
  - cheatsheet

  # Plan & Research
  - planning-cycles
  - spec-driven-development
  - vertical-slice-planning
  - plan-ticket-sync
  - grill-with-docs
  - plan-prereqs
  - update-proposal
  - research-methodology
  - research-output
  - study-reference
  - study-all-references

  # Build
  - feedback-loop-debugging
  - code-review
  - review-new-work
  - dispatch-review
  - coding-plan-limits
  - testing-guide
  - script-authoring
  - architecture-deepening
  - data-modeling
  - diagrams
  - mise-helper

  # Write & Document
  - writing-style
  - prose-check
  - readme-writing
  - agents-md-authoring
  - changelog-discipline
  - docs-audit

  # Verify & Ship
  - deployment-safety
  - git-protocol
  - release-protocol
  - adr-authoring

  # Maintain
  - init-project
  - adopt-project
  - project-cleanup
  - guidance-sync
  - project-winddown
  - skill-authoring
  - eval-criteria
  - multi-agent-validation
  - enforcement-hierarchy
  - mcp-partitioning

extensions:
  - name: recall
    description: "Cross-session memory — recalls past decisions, imports project knowledge"
    prerequisite:
      command: "recall --version"
      install_hint: "cargo install --path ~/code/recall (from a recall repo clone)"
    steering:
      - recall-session-start
      - recall-check
    skills:
      - recall
