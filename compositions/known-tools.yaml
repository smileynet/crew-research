# Known external tools — separately-owned repos that integrate with crew-research
# deployments. Unlike extensions (crew-owned content gated on a prerequisite),
# known tools own and deploy their OWN skills/steering; crew-research detects
# them, surfaces hydration hints, and carries recommendation seams in adjacent
# skills. Registry consumers: doctor.sh (detection), catalog.sh (listing),
# known-tools.sh (deploy/doctor/telemetry orchestration — reads the
# `orchestration:` block per tool).
#
# Ownership rule: crew-research references known tools, never copies their
# content. Their skills survive crew deploys via the symlink convention
# (init.sh prune preserves symlinks; see user-setup-guide).
#
# Repo path resolution (known-tools.sh): `repo:` holds the conventional
# ~/code/<name> location. The dispatcher resolves the ACTUAL path by probing,
# in order: $CREW_TOOLS_ROOT/<name>, the literal `repo:` value, ~/code/<name>,
# and (under WSL) /mnt/c/Users/$USER/code/<name>. A tool whose repo isn't found
# is skipped with a notice — never a hard failure. Set CREW_TOOLS_ROOT for
# non-standard layouts (e.g. repos on a D: drive).

tools:
  - name: archwright
    description: "Force-resolution design methodology — survey/forces/tensions/resolve pipeline producing verified architecture (patterns, models, checkable specs)"
    repo: "~/code/archwright"
    # Detection: archwright self-deploys its skills as symlinks into the skills tree
    detect:
      skill_glob: "archwright-*"
    hydrate: "gh repo clone smileynet/archwright ~/code/archwright && bash ~/code/archwright/tools/deploy-skills.sh"
    # Recommendation seams: crew skills that route to archwright when the work
    # shape fits. Content lives in each skill's SKILL.md (conditional on
    # detection — no broken references on machines without archwright).
    seams:
      - skill: architecture-deepening
        when: "friction traces to unresolved design-level tensions, not just module shape"
      - skill: spec-driven-development
        when: "specs need mechanical verification (constraints, invariants, state machines)"
      - skill: planning-cycles
        when: "planning surfaces competing forces that need explicit resolution"
      - skill: grill-with-docs
        when: "grill decisions should graduate into traceable forces/patterns"
      - skill: adr-authoring
        when: "a decision resolves a force tension and warrants a checkable pattern"
    # Overlap decisions (recorded 2026-07-19, ticket 37):
    # - Design-state review (survey/audit) and force resolution are archwright
    #   territory; code-level refactoring review stays native (architecture-deepening).
    # - crew-research OWNS the global subagent-reliability steering; archwright's
    #   deploy copying its fork over it is a known collision — fix tracked in
    #   archwright's ticket queue, crew content is authoritative meanwhile.

  - name: recall
    description: "Cross-session semantic memory — hybrid BM25 + vector search over ingested sessions and project knowledge"
    repo: "~/code/recall"
    detect:
      binary: recall
      skill_glob: "recall"
    # recall self-deploys its BINARY via scripts/deploy-local.{sh,ps1} (build +
    # OS-specific swap). It does NOT self-deploy a skill: its skill is the
    # crew-research fallback (atomics/skills/recall/), deployed by init.sh.
    # NOTE: `cargo install --path .` is broken for recall (ort dep, recall #049) —
    # the deploy-local scripts are the supported build path.
    hydrate: "gh repo clone smileynet/recall ~/code/recall && bash ~/code/recall/scripts/deploy-local.sh"
    fallback: "atomics/skills/recall"
    orchestration:
      # build: OS-selected — .ps1 on Windows-proper (Git Bash), .sh elsewhere
      #        (macOS/Linux/WSL). recall's scripts handle the per-OS binary swap
      #        and scheduler detection (launchd/systemd/cron/scheduled-task).
      # skills: none — recall's skill is crew's fallback, not self-deployed.
      deploy:
        build:
          windows: "pwsh scripts/deploy-local.ps1"
          unix: "bash scripts/deploy-local.sh"
        skills: null
      doctor:
        - "recall health --json"
        - "recall status"
      telemetry:
        - "recall telemetry status"
        - "recall telemetry stats"
    seams:
      - skill: recall
        when: "always (the skill IS the interface to this tool)"
      - skill: read-handoff
        when: "session start — recall prime supplements the handoff"
      - skill: guidance-sync
        when: "corrections detected that should persist as preferences (ticket 36)"

  - name: tkt
    description: "Ticket management CLI — frontier detection, dependency graphs, ID allocation, plan sync"
    repo: "~/code/tkt"
    detect:
      binary: tkt
      skill_glob: "tkt"
    hydrate: "gh repo clone smileynet/tkt ~/code/tkt && cargo install --path ~/code/tkt && bash ~/code/tkt/tools/deploy-skills.sh"
    orchestration:
      # tkt builds via cargo install (works, unlike recall) and self-deploys its
      # skill via tools/deploy-skills.sh (symlink into ~/.kiro,~/.claude,~/.codex).
      deploy:
        build:
          windows: "cargo install --path ."
          unix: "cargo install --path ."
        skills: "bash tools/deploy-skills.sh"
      doctor:
        - "tkt doctor -o json"
        - "tkt audit --brief"
        - "tkt validate --brief"
      telemetry:
        - "tkt telemetry --status"
        - "tkt telemetry --show"
    seams:
      - skill: ticket-planning
        when: "decomposing work into tickets (ticket-planning uses tkt when available)"
      - skill: spec-driven-development
        when: "specs reference .tickets/ structure"
